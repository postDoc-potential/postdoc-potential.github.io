<style>
    .btn {
        border: 2px solid black;
        background-color: white;
        color: black;
        padding-top: 24px;
        padding-left: 24px;
        padding-right: 24px;
        font-size: 16px;
        vertical-align:middle;
    }

    /* Green */
    .success {
        border-color: #0f2eda;
        color: black;

    }

    /* .success:hover {
        background-color: #0f2eda;
        color: white;
    } */
    /* Adding contact form css */

    #last {
        width: 100%;
        height: auto;
        display: flex; /* Corrected for centering content */
        justify-content: center;
        background-color: #ffb3b3;
    }

    .full {
        width: 80%;
        display: inline-block;
        margin: 2%;
        margin-left: 10%;
        text-align: center;
        background-color: black;
        color: white;
        border: 15px solid orange;
        border-radius: 5px;
        margin-bottom: 8%;
        margin-top: 8%;
    }

    .full h3 {
        font-size: 2rem;
        display: block;
        margin: 2%;
        margin-bottom: 0;
    }

    .lt {
        padding: 2%;
        margin: 2%;
    }

    .rt {
        padding: 2%;
        margin: 2%;
    }

    .lt textarea {
        width: 94%;
        margin-left: 2.8%;
    }

    button {
        margin: 2%;
    }

    .btn-primary {
        background-color: black;
        border: 2px solid white;
        border-radius: 5%; /* Adjusted for a cleaner appearance */
    }

    .list-item {
        margin-bottom: 2%;
        list-style-type: none;
    }

    .list-item span {
        margin-left: 10px;
        font-size: 1.4rem;
    }

    .list-item a {
        color: white;
        display: inline-block;
    }

    .list-item a:hover {
        text-decoration: underline;
    }

    .form-control {
        background-color: black;
    }

    @media screen and (min-width: 770px) {
        .full {
            width: 70%;
            margin-left: 15%;
        }

        .lt textarea {
            width: 95%;
            margin-left: 2.4%;
        }
    }

    @media screen and (min-width: 1100px) {
        .full {
            width: 65%;
            margin-left: 17%;
            margin-top: 5%;
        }

        .lt {
            width: 55%;
            display: inline-block;
            float: left;
            margin-right: 0;
        }

        .rt {
            width: 35%;
            display: inline-block;
            margin-left: 0;
        }

        .list-item {
            margin-bottom: 10%;
        }

        .contact-list {
            margin-top: 22%;
            padding-right: 8%;
        }

        .fa-envelope, .gmail {
            display: inline-block;
            width: auto;
        }
    }

    .column {
        float: left;
        width: 50%;
    }

    /* Clear floats after the columns */
    .row:after {
        content: "";
        display: table;
        clear: both;
    }
    #result {
        margin-top: 15px;
        font-weight: bold;
        text-align: center;
    }
</style>

<head>
    <link rel="stylesheet" 
          href="https://maxcdn.bootstrapcdn.com/bootstrap/4.4.1/css/bootstrap.min.css" />
    <link rel="stylesheet" 
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css" />
    <link rel="stylesheet" 
          href="style.css" />
</head>

<section id="last">
    <div class="full">
        <h3>Drop a Message</h3>
        <div class="lt">
        <form method="POST" id="form">
            <input type="hidden" name="access_key" value="073cc7af-bd2e-45fb-a3f4-4ec638461a14">
            <input type="hidden" name="subject" value="New Submission from Web3Forms">
            <input type="checkbox" name="botcheck" id="" style="display: none;">
            
            <input type="text" name="name" placeholder="NAME"required>
            <input type="email" name="email" placeholder="EMAIL" required>
            <textarea name="message" placeholder="MESSAGE" required></textarea>
            <button type="submit">
                <i class="fa fa-paper-plane"></i>
                <span class="send-text">SEND</span>
            </button>
            <div id="result"></div>
        </form>
        </div>
    </div>
</section>

<script>
const form = document.getElementById('form');
const result = document.getElementById('result');

form.addEventListener('submit', function(e) {
  e.preventDefault();
  const formData = new FormData(form);
      formData.append("access_key", "073cc7af-bd2e-45fb-a3f4-4ec638461a14");
  const object = Object.fromEntries(formData);
  const json = JSON.stringify(object);
  result.innerHTML = "Please wait..."

    fetch('https://api.web3forms.com/submit', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'Accept': 'application/json'
            },
            body: json
        })
        .then(async (response) => {
            let json = await response.json();
            if (response.status == 200) {
                result.innerHTML = json.message;
            } else {
                console.log(response);
                result.innerHTML = json.message;
            }
        })
        .catch(error => {
            console.log(error);
            result.innerHTML = "Something went wrong!";
        })
        .then(function() {
            form.reset();
            setTimeout(() => {
                result.style.display = "none";
            }, 3000);
        });
});
</script>
