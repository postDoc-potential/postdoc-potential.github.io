<!DOCTYPE html>
<html lang="{{ site.lang | default: 'en-US' }}">
  <head>
    <meta charset="UTF-8">
    <meta http-equiv="X-UA-Compatible" content="IE=edge">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="keywords" content="postdoc, phd, earth science, academia, research, fellowship">
    {% seo %}
    <link rel="stylesheet" href="{{ '/assets/css/style.css?v=' | append: site.github.build_revision | relative_url }}">
  </head>
  <body>
    {% include header.html %}
    <section>{{ content }}</section>
    <footer>
      <div class="footer-inner">
        <div class="footer-left">© 2026 PostDoc Potential</div>
        <div class="footer-right">
          {% if site.github.is_project_page %}
          <p>This project is maintained by <a href="{{ site.github.owner_url }}">{{ site.github.owner_name }}</a></p>
          {% endif %}
          <p><small>Hosted on GitHub Pages &mdash;<br>Created by <a href="https://github.com/SRituparna">Rituparna</a></small></p>
        </div>
      </div>
    </footer>
  <script src="{{ '/assets/js/scale.fix.js' | relative_url }}"></script>
  </body>
</html>
