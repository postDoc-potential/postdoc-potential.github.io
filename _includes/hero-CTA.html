<style>
  .row-cta {
    display: flex;
    flex-wrap: wrap;
    width: 100%;
    border: none;
    border-radius: 5px;
    color: white;
    font-weight: bold;
    background-color:#063D88;
    gap: 3rem;
    padding: 1rem;
    margin: 0;
    align-items: baseline;
  }

  .column-cta-left {
    flex: 0 1 60%;
    float: left;
    text-align: left;
    gap: 1rem;
    font-size: 1.2rem;
    text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.5);
  }

  .column-cta-right {
    flex: 1 1 35%;
    float: right;
    align-items: right;
    margin-left: auto;
    text-align: right;
  }

  .column-cta-right a {
    color:  black;
    text-decoration: none; /* no underline */
  }

  .column-cta-right button {
    border: 3px solid rgba(228, 35, 17, 0.8);
    outline: 0;
    display: inline-block;
    padding: 10px 25px;
    color: black;
    background-color:  #E9F1F9ff;
    border-radius: 5px ;
    text-align: center;
    font-weight: bold;
    cursor: pointer;
    box-shadow:0 8px 16px 0 rgba(0,0,0,0.6);
  }

  .column-cta-right button:hover {
    border: 3px solid #B8292A;
    outline: 0;
    background-color: rgba(228, 35, 17, 0.8);
    color: white;
    box-shadow:0 8px 16px 0 rgba(0,0,0,0.6);
  }

  .column-cta-right button:hover a {
    color: white;
    text-decoration: none; /* no underline */
  }

  @media (max-width: 768px) {
    .row-cta {
      flex-direction: column;
      align-items: center;
      text-align: center;
      gap: 1rem;
    }

    .column-cta-left,
    .column-cta-right {
      flex: 1 1 100%;
      text-align: center;
    }

    .column-cta-right {
      margin-left: 0;
    }
  }

</style>

<div class="row-cta">
  <div class="column-cta-left">
    <p>Want to share your views on postdoctoral opportunities?</p>
  </div>
  <div class="column-cta-right">
    <button><a class="hero-button" style="text-decoration:none;" href="{{ '/survey/' | relative_url }}" target="_blank">Take a quick survey</a></button>
  </div>
</div>
