<!DOCTYPE html>
<html>
  <head>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">
    <script src="https://unpkg.com/survey-core@2.5.25/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.25/survey.i18n.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.25/themes/index.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui@2.5.25/survey-js-ui.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/survey-core@2.5.25/survey-core.min.css" />
    <link rel="stylesheet" href ="index.css" />
  </head>
  <body>
    <div id="surveyElement" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; min-height: 100%; height:100%"></div>
    <footer>
      <div class="footer-inner">
        <div class="footer-left"><p>© 2026 <a href="https://postdoc-potential.github.io">PostDoc Potential</a></p></div>
        <div class="footer-right">
          <p><small>Hosted on <a href="https://docs.github.com/en/pages">GitHub Pages</a> <br>&mdash; Created with <a href="https://surveyjs.io/">SurveyJS</a></small></p>
        </div>
      </div>
    </footer>
    <script src="json.js"></script>
    <script src="theme.js"></script>
    <script src="index.js"></script>
    <script>
    async function loadSurvey() {
      const response = await fetch("survey.json");
      const surveyJson = await response.json();

      const survey = new Survey.Model(surveyJson);

      survey.onComplete.add((sender) => {
        console.log(sender.data);
      });

      survey.render(
        document.getElementById("surveyContainer")
      );
    }
    document.addEventListener("DOMContentLoaded", loadSurvey);
    </script>
    <script>
    survey.onComplete.add(async (sender) => {
    try {
        const response = await fetch("https://script.google.com/macros/s/AKfycbyL3j5W9HBqZabSdAdTxgi2ZBVPyBriYnR9wwmraKvIaYY76tBZQ6zBSqMYlUfuAKMtkg/exec", {
        method: "POST",
        mode: "no-cors",

        headers: {
            "Content-Type": "application/json"
        },
        body: JSON.stringify(sender.data)
        });

        console.log("Status:", response.status);
        console.log("Response:", await response.text());

        alert("Submission sent");
    } catch (err) {
        console.error("Fetch failed:", err);
        alert("Fetch failed: " + err.message);
    }
    });
    </script>
    <script>
    const VERSION = "2.0.1"; // Change here before deployment
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = `index.css?v=${VERSION}`;
    document.head.appendChild(css);

    [
      `json.js?v=${VERSION}`,
      `theme.js?v=${VERSION}`,
      `index.js?v=${VERSION}`
    ].forEach(src => {
      const script = document.createElement("script");
      script.src = src;
      document.body.appendChild(script);
    });
  </script>
  </body>
</html>
