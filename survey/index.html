
<!DOCTYPE html>
<html>
  <head>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="color-scheme" content="light">

    <title>PostDoc Potential — Survey</title>
    <meta property="og:title" content="PostDoc Potential — Survey">
    <meta property="og:description" content="Share your postdoc transition experience to help build resources for early-career Earth, atmospheric, ocean and climate scientists.">
    <meta property="og:url" content="{{ site.url }}{{ '/survey/' | relative_url }}">
    <meta property="og:image" content="{{ site.url }}{{ 'assets/img/survey_tn.png' | relative_url }}">

    <script src="https://unpkg.com/survey-core@2.5.25/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.25/survey.i18n.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.25/themes/index.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui@2.5.25/survey-js-ui.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/survey-core@2.5.25/survey-core.min.css" />
    <link rel="stylesheet" href ="index.css" />
  </head>
  <body>
    <div id="surveyElement" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; min-height: 100%; height:100%"></div>
    <footer>
      <div class="footer-inner">
        <div class="footer-left">
          <p>© 2026 <a href="https://postdoc-potential.github.io" target="_blank">PostDoc Potential</a></p>
          <p><small>See our <a href="{{ '/credits' | relative_url }}" target="_blank">Credits, License and Privacy</a> statement</small></p>
        </div>
        <div class="footer-right">
          <p>Hosted on <a href="https://docs.github.com/en/pages" target="_blank">GitHub Pages</a><br>&mdash; Created with <a href="https://surveyjs.io/" target="_blank">SurveyJS</a></p>
        </div>
      </div>
    </footer>
    
    <script>  
    const VERSION = "2.0.2"; // Change here before deployment
    const css = document.createElement("link");
    css.rel = "stylesheet";
    css.href = `index.css?v=${VERSION}`;
    document.head.appendChild(css);

    [
      `json.js?v=${VERSION}`,
      `theme.js?v=${VERSION}`,
      `index.js?v=${VERSION}`
    ].forEach(src => {
      const script = document.createElement("script");
      script.src = src;
      script.async = false;
      document.body.appendChild(script);
    });
  </script>
  </body>
</html>
