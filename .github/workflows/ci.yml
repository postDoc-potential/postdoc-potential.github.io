name: Lighthouse Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Run Lighthouse CI
        id: lighthouse
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://postdoc-potential.github.io/
          uploadArtifacts: true

      - name: Publish badges to Gist
        env:
          GIST_TOKEN: ${{ secrets.GIST_TOKEN }}
          GIST_ID: 7f89587c48badb08ea3dff70b82d5e4c
        run: |
          node -e '
            const fs = require("fs");
            const files = {};
            for (const f of fs.readdirSync("badges")) {
              files[f] = { content: fs.readFileSync(`badges/${f}`, "utf8") };
            }
            fetch(`https://api.github.com/gists/${process.env.GIST_ID}`, {
              method: "PATCH",
              headers: {
                "Authorization": `token ${process.env.GIST_TOKEN}`,
                "Accept": "application/vnd.github+json",
              },
              body: JSON.stringify({ files }),
            })
              .then(async (res) => {
                console.log("Status:", res.status);
                console.log(await res.text());
                if (!res.ok) process.exit(1);
              })
              .catch((err) => {
                console.error(err);
                process.exit(1);
              });
          '