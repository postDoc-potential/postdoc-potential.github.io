name: Lighthouse Audit

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  lighthouse:
    runs-on: ubuntu-latest

    steps:
      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          urls: |
            https://postdoc-potential.github.io/
          uploadArtifacts: true
          temporaryPublicStorage: true