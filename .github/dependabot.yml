version: 2
updates:
  - package-ecosystem: "bundler"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
    pull-request-branch-name:
      separator: "/"
    reviewers:
      - "postDoc-potential/maintainers"
    assignees:
      - "postDoc-potential/maintainers"
    commit-message:
      prefix: "chore(deps):"
      include: "scope"
