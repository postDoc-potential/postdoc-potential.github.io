<!DOCTYPE html>
<html>
  <head>
    <meta name="robots" content="noindex">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <script src="https://unpkg.com/survey-core@2.5.25/survey.core.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.25/survey.i18n.min.js"></script>
    <script src="https://unpkg.com/survey-core@2.5.25/themes/index.min.js"></script>
    <script src="https://unpkg.com/survey-js-ui@2.5.25/survey-js-ui.min.js"></script>
    <link rel="stylesheet" href="https://unpkg.com/survey-core@2.5.25/survey-core.min.css" />
    <link rel="stylesheet" href ="index.css" />
  </head>
  <body>
    <div id="surveyElement" style="position: absolute; top: 0; left: 0; right: 0; bottom: 0; min-height: 100%; height:100%"></div>
    <script src="json.js"></script>
    <script src="theme.js"></script>
    <script src="index.js"></script>
  </body>
</html>
<script>
survey.onComplete.add(async (sender) => {
  try {
    const response = await fetch("https://script.google.com/macros/s/AKfycbyL3j5W9HBqZabSdAdTxgi2ZBVPyBriYnR9wwmraKvIaYY76tBZQ6zBSqMYlUfuAKMtkg/exec", {
      method: "POST",
      mode: "no-cors",

      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify(sender.data)
    });

    console.log("Status:", response.status);
    console.log("Response:", await response.text());

    alert("Submission sent");
  } catch (err) {
    console.error("Fetch failed:", err);
    alert("Fetch failed: " + err.message);
  }
});
loadSurvey();
</script>
